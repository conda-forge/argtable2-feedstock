schema_version: 1

context:
  version: "2.13"

package:
  name: argtable2
  version: ${{ version }}

source:
  url: http://prdownloads.sourceforge.net/argtable/argtable2-13.tar.gz
  sha256: 8f77e8a7ced5301af6e22f47302fdbc3b1ff41f2b83c43c77ae5ca041771ddbf
  patches:
    - fix-newer-mac-osx.patch

build:
  number: 1005
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
  run_exports:
    - ${{ pin_subpackage('argtable2', upper_bound='x') }}

tests:
  - requirements:
      run:
        - conda-build
    script:
      - if: osx
        then:
          - test -f "$PREFIX/lib/libargtable2.dylib"
          - conda inspect objects -p "$PREFIX" argtable2
      - if: linux
        then:
          - test -f "$PREFIX/lib/libargtable2.so"
          - conda inspect linkages -p "$PREFIX" argtable2

about:
  homepage: http://argtable.sourceforge.net/
  license: LGPL-2.0-only
  license_file: COPYING
  summary: Argtable is an ANSI C command line parser.

extra:
  recipe-maintainers:
    - hbredin
    - martin-g
    - thomasfillon
